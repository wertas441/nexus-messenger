version: "3.9"

services:
  db:
    image: postgres:16
    container_name: nexus-messenger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    volumes:
      - nexus_messenger_db_data:/var/lib/postgresql/data

volumes:
  nexus_messenger_db_data:
    driver: local
